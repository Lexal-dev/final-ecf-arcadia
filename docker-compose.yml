services:
  mysql:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    image: mysql:latest
    container_name: mysql-arcadia
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DEV_DB_DATABASE}
    ports:
      - "3306:3306"
    networks:
      - arcadia-networks
    volumes:
      - mysql-data:/var/lib/mysql

  arcadia:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arcadia-app
    ports:
      - "3000:3000"
    environment:
      DB_NODE_ENV: ${NODE_ENV}
      DB_HOST: ${DEV_DB_HOST}
      DB_USER: ${DEV_DB_USER}
      DB_PASSWORD: ${DEV_DB_PASSWORD}
      DEV_DB_DATABASE: ${DEV_DB_DATABASE}
    depends_on:
      - mysql
    networks:
      - arcadia-networks
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]

networks:
  arcadia-networks:
    driver: bridge

volumes:
  mysql-data:
    driver: local
